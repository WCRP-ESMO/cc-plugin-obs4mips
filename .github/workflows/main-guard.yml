name: main-guard
on:
  pull_request:
    branches: [main]
jobs:
  only-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs to main must come from the dev branch (got '${{ github.head_ref }}')"
            exit 1
          fi