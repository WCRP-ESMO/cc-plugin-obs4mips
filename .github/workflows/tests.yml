name: tests

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --dev
      - name: Check formatting and code quality
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest -q
      - name: Verify generated CV snapshots
        run: uv run python scripts/sync_cvs.py --check
